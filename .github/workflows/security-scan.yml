name: DevSecOps Unified Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. SAST - CodeQL (Python + JavaScript / TypeScript)
  # ---------------------------------------------------------------------------
  sast-codeql:
    name: SAST (CodeQL - Python & JS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript-typescript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # 2. SAST - ShellScript (ShellCheck)
  # ---------------------------------------------------------------------------
  sast-shellscript:
    name: SAST (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: 'node_modules .venv'

  # ---------------------------------------------------------------------------
  # 3. SAST - PowerShell (PSScriptAnalyzer)
  # ---------------------------------------------------------------------------
  sast-powershell:
    name: SAST (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse
          if ($results) {
              $results | Format-Table -AutoSize
              throw "Foram encontradas inconformidades pelo PSScriptAnalyzer."
          }

  # ---------------------------------------------------------------------------
  # 4. SCA - OSV-Scanner (Multilinguagem: pip, npm, etc.)
  # ---------------------------------------------------------------------------
  sca-osv:
    name: SCA (OSV-Scanner)
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0"